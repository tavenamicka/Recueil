services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recueil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recueil}
      POSTGRES_DB: ${POSTGRES_DB:-recueil}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recueil}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-recueil}:${POSTGRES_PASSWORD:-recueil}@db:5432/${POSTGRES_DB:-recueil}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MEDIA_ROOT: /data/media
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@recueil.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    volumes:
      - ./backend:/app
      - media_data:/data/media
    # Pas de publication de port : le backend n'est joint que par le frontend
    # via le reseau Docker interne (nginx proxy_pass http://backend:8000).
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8090:80"

volumes:
  postgres_data:
  media_data:
